plugins {
  id 'fabric-loom' version '1.6-SNAPSHOT'
  id 'maven-publish'
}

repositories {
  mavenCentral()
  maven {
    name = 'Fabric'
    url = 'https://maven.fabricmc.net/'
  }
}

version = project.property('mod_version')

loom {
  minecraftVersion = project.property('minecraft_version')
  runConfigs.create {
    name = 'client'
    mainClass = 'net.fabricmc.loader.launch.knot.KnotClient'
    args = ['--username', 'Player', '--version', 'mcp${minecraftVersion.replace(".", "_")}']
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
  mappings "net.fabricmc:yarn:${project.property('minecraft_version')}+build.${project.property('loader_version')}:v2"
  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('loader_version')}"
  modImplementation "com.simibubi.create:create-fabric:${project.property('create_version')}"
}

processResources {
  inputs.property "version", project.version
  inputs.property "minecraft_version", project.property('minecraft_version')
}

jar {
  from {
    configurations.compileClasspath.collect {
      it.isDirectory() ? it : zipTree(it)
    }
  }
}